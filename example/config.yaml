# =============================================================================
# vpnconfig — конфигурация приложения
# =============================================================================
# Этот файл содержит все настройки приложения для обновления конфигурации sing-box.
# Обязательные поля отмечены комментарием [ОБЯЗАТЕЛЬНО], опциональные — [ОПЦИОНАЛЬНО].

# =============================================================================
# [ОБЯЗАТЕЛЬНО] Основные настройки
# =============================================================================

# Путь к файлу кеша для результатов определения страны по IP (ip-api.com).
# Кеш уменьшает количество запросов к внешним API.
# При превышении max_cache_size_bytes файл очищается автоматически.
# Формат: JSON-файл {"IP": {"country": "...", "timestamp": "..."}}
cache_path: "/opt/updater/cache.json"

# Путь к файлу конфигурации sing-box, который обновляется приложением.
# Это основной конфиг sing-box на роутере.
# Сюда записываются новые outbounds после успешного обновления.
singbox_config: "/etc/sing-box/config.json"

# Директория для сохранения бэкапов конфигурации sing-box.
# Перед каждым обновлением создаётся бэкап с timestamp в имени файла.
# Формат имени: <имя_конфига>.backup_YYYYMMDD_HHMMSS
backup_dir: "/opt/updater/backups"

# Максимальное количество файлов бэкапов.
# При превышении удаляются самые старые бэкапы.
# Если 0 — бэкапы не удаляются.
max_backups: 10

# Максимальный размер файла кеша в байтах.
# При превышении файла кеша он очищается.
# Значение 10485760 = 10 МБ.
max_cache_size_bytes: 10485760

# Директория для файлов логов.
# Каждый запуск создаёт отдельный файл: vpnconfig_YYYYMMDD_HHMMSS.log
# Если пустая строка — логи пишутся только в stderr.
log_dir: "/opt/updater/logs"

# =============================================================================
# [ОБЯЗАТЕЛЬНО] Настройки URLTest по умолчанию
# =============================================================================
# Используются для всех секций, если не переопределены на уровне секции.

urltest_defaults:
  # URL для проверки задержки (latency test).
  # sing-box будет пинговать этот адрес для определения быстрого сервера.
  url: "https://www.gstatic.com/generate_204"

  # Интервал между проверками задержки.
  # Формат: Go duration string ("30s", "3m", "1h").
  interval: "3m"

  # Допуск задержки в миллисекундах.
  # Если разница задержки между серверами меньше tolerance —
  # серверы считаются равноценными, переключение не происходит.
  tolerance: 50

# =============================================================================
# [ОБЯЗАТЕЛЬНО] Секции
# =============================================================================
# Каждая секция соответствует URLTest-группе в podkop.
# Имя секции (name) должно совпадать с именем URLTest-секции в podkop.
# При обновлении: старые outbounds секции удаляются, новые генерируются.
# Каждая секция может содержать несколько источников VPN-ссылок.

sections:
  # Секция для серверов в западной Европе и США
  - name: "MULTI_WEST"
    # Список стран. Серверы из этих стран попадут в секцию.
    # Страны определяются по IP-адресу через геолокационные сервисы.
    countries:
      - "Lithuania"
      - "Netherlands"
      - "United States"
      - "Sweden"
    # Источники VPN-ссылок. Каждый источник имеет тип и список URL.
    sources:
      # happ — base64-encoded подписка hynet.space
      - type: happ
        urls:
          - "https://hynet.space/s/YOUR_SUBSCRIPTION_ID_1"
          - "https://hynet.space/s/YOUR_SUBSCRIPTION_ID_2"
      # plaintext — plain text подписка (одна ссылка на строку)
      - type: plaintext
        urls:
          - "https://raw.githubusercontent.com/user/vpn-configs/main/ru/vless.txt"
          - "https://raw.githubusercontent.com/user/vpn-configs/main/ru/trojan.txt"
    # [ОПЦИОНАЛЬНО] Переопределение настроек urltest для этой секции.
    # Если не указано — используются значения из urltest_defaults.
    # urltest:
    #   url: "https://custom-url.com"
    #   interval: "5m"
    #   tolerance: 100

  # Секция для российских серверов
  - name: "MULTI_RU"
    countries:
      - "Russia"
    sources:
      - type: happ
        urls:
          - "https://hynet.space/s/YOUR_SUBSCRIPTION_ID_RU"
      - type: plaintext
        urls:
          - "https://raw.githubusercontent.com/user/vpn-configs/main/ru/vless_ru.txt"

# =============================================================================
# [ОПЦИОНАЛЬНО] Провайдеры для определения страны по IP
# =============================================================================
# vpnconfig поддерживает несколько сервисов для определения страны по IP.
# По умолчанию используются все 6 провайдеров с последовательным fallback:
# если первый недоступен — запрос идёт ко второму, и так далее.
#
# Доступные провайдеры:
#   ipapi_co       — ipapi.co (HTTPS, поле "country")
#   ip_api_com     — ip-api.com (HTTP, поле "country")
#   ipwho_is       — ipwho.is (HTTPS, поле "country")
#   api_2ip_me     — api.2ip.me (HTTPS, поле "country" на англ.)
#   api_ip_sb      — api.ip.sb (HTTPS, поле "country")
#   freegeoip_app  — freegeoip.app (HTTPS, поле "country_name")
#
# Если не указано — используются все провайдеры в порядке выше.
# Порядок в списке определяет приоритет: первый — самый предпочтительный.
#
# geo_providers:
#   - ipapi_co
#   - ip_api_com
#   - ipwho_is

# =============================================================================
# [ОПЦИОНАЛЬНО] Локальный MMDB-провайдер (MaxMind GeoLite2-Country)
# =============================================================================
# Провайдер определения страны по IP через локальную базу данных MaxMind.
# Работа полностью офлайн, без обращения к внешним API.
# При первом запуске база скачивается автоматически.
#
# Поведение:
#   - Если enabled: true — MMDB добавляется в начало списка провайдеров.
#     HTTP-провайдеры становятся fallback'ом.
#   - Если файл database_path отсутствует — база скачивается по download_url.
#   - Если файл старше max_age — база перезагружается автоматически при старте.
#   - Все промежуточные директории в database_path создаются автоматически.
#
# mmdb:
#   # Флаг активации MMDB-провайдера. По умолчанию false.
#   enabled: true
#
#   # Путь к файлу базы данных (.mmdb). Обязателен при enabled: true.
#   # При отсутствии файла он будет скачан автоматически.
#   database_path: "/opt/vpnconfig/GeoLite2-Country.mmdb"
#
#   # [ОПЦИОНАЛЬНО] URL для скачивания базы.
#   # По умолчанию: https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-Country.mmdb
#   download_url: "https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-Country.mmdb"
#
#   # [ОПЦИОНАЛЬНО] Максимально допустимый возраст файла базы.
#   # Если файл старше — перезагружается автоматически при старте.
#   # Формат: Go duration string ("24h", "168h", "720h").
#   # По умолчанию: 168h (1 неделя) — MaxMind обновляет базу еженедельно.
#   max_age: "168h"

# =============================================================================
# [ОПЦИОНАЛЬНО] CLI-проверка конфигурации sing-box
# =============================================================================
# Для предотвращения записи невалидной конфигурации можно включить проверку
# через CLI-утилиту sing-box. При включении:
#
#   1. Конфиг сохраняется во временный файл (<путь>.tmp)
#   2. Выполняется команда: sing-box --config <tmp_path> check
#   3. Если проверка прошла — временный файл заменяет оригинальный атомарно
#   4. Если проверка не прошла — временный файл удаляется, оригинал не меняется
#
# Пример успешной проверки:
#   $ sing-box --config /etc/sing-box/config.json check
#   $ echo $?
#   0
#
# Пример неуспешной проверки:
#   $ sing-box --config /etc/sing-box/config.json check
#   FATAL[0000] initialize router: parse rule-set[0]: open /tmp/.../rulesets/...: no such file or directory
#   $ echo $?
#   1
#
# singbox_cli:
#   # Флаг активации проверки конфига через CLI. По умолчанию false.
#   enabled: true
#
#   # [ОПЦИОНАЛЬНО] Путь к утилите sing-box.
#   # Если не указан или пустая строка — используется "sing-box" из PATH.
#   cli_path: "sing-box"

# =============================================================================
# [ОПЦИОНАЛЬНО] DNS-резолверы
# =============================================================================
# Список DNS-резолверов, используемых для определения IP по доменному имени
# при парсинге VPN-ссылок. Порядок определяет приоритет fallback: запрос
# идёт к первому; при сбое — ко второму, и так далее.
#
# Если не указано — используется системный резолвер (net.DefaultResolver).
#
# Поддерживаемые схемы URL:
#   - "https://host/path" — DNS over HTTPS (путь обязателен, например "/dns-query")
#   - "tls://host[:port]"  — DNS over TLS (порт по умолчанию 853)
#   - "host[:port]"        — обычный DNS через UDP/TCP (порт по умолчанию 53)
#   - "ip[:port]"          — обычный DNS по IP-адресу
#
# dns_resolvers:
#   # DoH Cloudflare
#   - "https://cloudflare-dns.com/dns-query"
#   # DoH Google
#   - "https://dns.google/dns-query"
#   # DoT Cloudflare (порт 853 по умолчанию)
#   - "tls://1.1.1.1"
#   # Обычный DNS по IP
#   - "1.1.1.1:53"
#   # Обычный DNS по домену
#   - "dns.google"
